<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Abstract Geometric Mark for RouteDefense -->
  <g transform="translate(150, 100)">
    <!-- Outer Shield / Pathway -->
    <path d="M 0 200 L 0 0 L 100 0 L 200 100 L 200 200 Z" fill="none" stroke="#111111" stroke-width="24" stroke-linejoin="miter" />
    <!-- Inner Forward Motion Line -->
    <path d="M 60 200 L 60 60 L 100 60 L 140 100 L 140 200" fill="none" stroke="#111111" stroke-width="24" stroke-linejoin="miter" />
    <!-- The Accent (Safety Red) - representing resolution -->
    <rect x="116" y="150" width="24" height="24" fill="#E63946" />
  </g>
  <!-- Authoritative Typography -->
  <text x="250" y="380" font-family="'Geist', 'Inter', system-ui, sans-serif" font-weight="800" font-size="32" fill="#111111" letter-spacing="8" text-anchor="middle">ROUTEDEFENSE</text>
  <text x="250" y="420" font-family="'Geist', 'Inter', system-ui, sans-serif" font-weight="500" font-size="12" fill="#888888" letter-spacing="5" text-anchor="middle">PREMIUM LEGAL NETWORK</text>
</svg>
