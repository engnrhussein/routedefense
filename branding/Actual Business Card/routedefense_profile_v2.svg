       x="0"
       y="170"
       font-family="'Geist', 'Inter', -apple-system, sans-serif"
       font-size="44px"
       font-weight="900"
       fill="#FFFFFF"
       letter-spacing="10"
       text-anchor="middle"
       id="brand_headline">ROUTEDEFENSE</text>

