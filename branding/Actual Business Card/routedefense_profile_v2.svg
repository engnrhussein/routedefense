         y="4.5"
         font-family="'Geist', 'Inter', -apple-system, sans-serif"
         font-size="12px"
         font-weight="800"
         fill="#E63946"
         letter-spacing="5"
         text-anchor="middle">LEGAL TECHNOLOGY NETWORK</text>
    </g>
